<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Platformer Game</title>
<link rel="stylesheet" href="css/platformer-style.css">
</head>
<body>

<!-- Start Screen -->
<div id="start-screen">
    <h1>Mini Platformer Game</h1>
    <button id="start-btn">Start Game</button>
</div>

<!-- Game Container -->
<div id="game-container" style="display:none;">
    <p>Score: <span id="score">0</span> | Time: <span id="timer">30</span>s</p>
    <div id="game-area">
        <div id="player"></div>
    </div>
    <p>Use ← → arrows to move, ↑ to jump</p>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <button id="left-btn">◀</button>
        <button id="jump-btn">▲</button>
        <button id="right-btn">▶</button>
    </div>
</div>

<!-- Game Over Screen -->
<div id="game-over" style="display:none;">
    <h1>You Are Out!</h1>
    <p>Your Score: <span id="final-score">0</span></p>
    <button id="play-again">Play Again</button>
</div>

<script src="js/platformer.js"></script>
</body>
</html>
